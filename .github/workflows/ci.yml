name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', 'lts/*']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check all scripts
        run: |
          set -e
          for f in bin/toolkit $(find lib -name '*.js') $(find test -name '*.js'); do
            node --check "$f"
          done
      - name: Run test suite
        run: npm test
